
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: |
      dotnet restore
      dotnet build --configuration Release --no-restore
    workingDirectory: 'backend/.Net app'
    displayName: 'Restore and Build .NET Backend'

  - task: NodeTool@0
    displayName: 'Install Node.js 20'
    inputs:
      versionSpec: '20.x'

  - script: |
      npm ci
      npm run build
    workingDirectory: 'frontend'
    displayName: 'Install and Build React Frontend'
